[build-system]
requires = ["setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levistone"
authors = [{ name = "LeviMC" }]
description = "A runtime for running Endstone plugins on LeviLamina (Python plugins only)."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["plugin", "python", "minecraft", "bedrock"]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "aiohttp",
    "asyncio",
    "click",
    "importlib-metadata",
    "importlib-resources",
    "lazy-loader",
    "numpy",
    "packaging",
    "pkginfo",
    "psutil",
    "pyyaml",
    "requests",
    "rich",
    "tomlkit",
    "typing-extensions",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/LiteLDev/LeviStone/blob/main/CHANGELOG.md"
Documentation = "https://endstone.dev"
Homepage = "https://github.com/LiteLDev/LeviStone"
Issues = "https://github.com/LiteLDev/LeviStone/issues"
Repository = "https://github.com/LiteLDev/LeviStone"

[tool.setuptools]
package-dir = { "" = "bin/EndstoneRuntime" }

[tool.setuptools.packages.find]
where = ["bin/EndstoneRuntime"]

[tool.setuptools.data-files]
"" = [
    "bin/EndstoneRuntime/*.dll",
    "bin/EndstoneRuntime/*.pdb",
    "bin/EndstoneRuntime/*.json",
]

[tool.setuptools.package-data]
"*" = ["*"]

[tool.setuptools_scm]
write_to = "endstone/endstone/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
scm.git.describe_command = "git describe --tags --long --match *[0-9]*"

[tool.ruff]
line-length = 120
lint.extend-select = ["I", "E", "F"]

# Don't repair Windows wheels
[tool.cibuildwheel.windows]
repair-wheel-command = ""

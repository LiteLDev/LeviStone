name: Build LeviStone 0.11.7

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      
      - name: Install LLVM
        run: choco install llvm
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Build
        run: |
          xmake f -p windows -a x64 -m release --toolchain=clang-cl -y
          xmake -v -y
      
      - name: Pack
        run: |
          pip install build
          python -m build
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: levistone-0.11.7
          path: dist/*.whl
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
          generate_release_notes: true
